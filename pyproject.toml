[project]
name = "ai-concepts"
version = "0.1.0"
description = "Explore and explain AI concepts with coding agents and Manim."
requires-python = ">=3.12,<3.14"
dependencies = ["manim>=0.19,<0.23"]

[dependency-groups]
dev = [
    "black>=25,<27",
    "mypy>=1.10,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '/(\.agents/skills|media|work)/'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^\\.agents/skills/",
    "^media/",
    "^work/",
]
